name: LedgerGuard CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ledgerguard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python project and audit tool
        working-directory: backend
        run: |
          python -m pip install --upgrade pip==26.2.2
          python -m pip install -e ".[dev]"
      - name: Audit Python dependencies
        working-directory: backend
        run: python -m pip_audit --local --skip-editable
      - name: Audit locked frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Scan tracked files for credential patterns
        shell: pwsh
        run: ./scripts/scan-secrets.ps1

  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check src tests migrations
      - run: python -m ruff check src tests migrations
      - run: python -m mypy src
      - run: python -m pytest --cov=ledgerguard --cov-report=term --cov-report=xml
      - run: alembic upgrade head --sql > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  integration-and-browser:
    runs-on: ubuntu-latest
    needs: [security-scans, backend-quality, frontend-quality]
    env:
      COMPOSE_PROJECT_NAME: ledgerguard-ci
      LEDGERGUARD_RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start isolated application stack
        run: docker compose up -d --build --wait
      - name: Seed synthetic evidence
        run: |
          docker compose exec -T api ledgerguard-seed
          docker compose exec -T api ledgerguard-seed-reconciliation
          docker compose exec -T api ledgerguard-seed-fraud
      - name: Run PostgreSQL Redis and worker integration tests
        run: docker compose exec -T -e LEDGERGUARD_RUN_INTEGRATION=1 api pytest -q -p no:cacheprovider tests/test_background_integration.py
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run role journeys
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
      - name: Capture service logs
        if: failure()
        run: docker compose logs --no-color > compose.log
      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose.log
      - name: Stop isolated application stack
        if: always()
        run: docker compose down --volumes --remove-orphans
