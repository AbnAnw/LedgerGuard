[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ledgerguard"
version = "0.1.0"
description = "Transaction reconciliation and fraud-monitoring platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.14.0",
  "argon2-cffi==23.1.0",
  "celery[redis]==5.4.0",
  "fastapi==0.115.6",
  "psycopg[binary]==3.2.3",
  "pydantic-settings==2.7.1",
  "python-multipart==0.0.20",
  "redis==5.2.1",
  "sqlalchemy==2.0.36",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.14.1",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.8.4",
]

[project.scripts]
ledgerguard-seed = "ledgerguard.cli:seed"
ledgerguard-seed-reconciliation = "ledgerguard.cli:seed_reconciliation"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerguard"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
markers = [
  "integration: requires the Docker Compose PostgreSQL, Redis, and Celery services",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
plugins = ["sqlalchemy.ext.mypy.plugin"]
strict = true
warn_unused_configs = true
